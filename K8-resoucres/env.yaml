apiVersion: v1
kind: Pod
metadata:
  name: env
  labels:
    app: roboshop
    component: cart

spec:
  containers:
  - name: cart
    image: roboshop/cart:1.0
    env:
      - name: MONGO_URL
        value: "mongodb://mongodb.svc.cluster.local:27017/cart"
      - name: REDIS_URL
        value: "redis://redis.svc.cluster.local:6379"

