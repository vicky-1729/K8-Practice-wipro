apiVersion: v1
kind: Pod
metadata:
  name: resources-pod
  labels:
    environment: prod
    project: roboshop
    component: backend
    app: nodejs

spec:
  containers:
  - name: nginx-resources
    image: nginx
    resources:
      requests:
        # soft limit
        memory: "64Mi"
        cpu: "250m"
      limits:
        # hard limit
        memory: "128Mi"
        cpu: "500m"
        #OOM
